<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script>
        const now = new Date();
        const vancouver = new Date(now.toLocaleString("en-US", { timeZone: "America/Vancouver" }));

        const cutoff = new Date(vancouver);
        cutoff.setHours(11, 30, 0, 0); // 11:30 AM Vancouver time

        if (vancouver >= cutoff) {
            window.location.replace("https://democracyrising.ca/");
        } else {
            window.location.replace("instructions.md");
        }
    </script>
</head>
<body>
    <a href="instructions.md">Loading...</a>
</body>
</html>
